<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasbih</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Tasbih</h1>
    <p>Welcome to the Tasbih page. Here you can perform all your Adhkar (remembrances of Allah) at your comfort zone.</p>
    <div id="container">
        <label for="subhanallah">Subhanallah: 
            <button id="subhanallah" onclick="subhanallah()">0</button>
        </label>

        <label for="alhamdulillah">Alhamdulillah: 
            <button id="alhamdulillah" onclick="alhamdulillah()">0</button>
        </label>
        <label for="allahuakbar">Allahu Akbar: 
            <button id="allahuakbar" onclick="allahuakbar()">0</button>
        </label>
        <label for="reset">Reset: 
            <button id="reset" onclick="resetCounters()">Reset</button>
        </label>
    </div>
    <script src="script.js"></script>
</body>
</html>
